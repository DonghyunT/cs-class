name: Verify CS Class
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: scope
        name: Select verification scope
        run: node scripts/ci-policy.mjs scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify policy and documentation
        env:
          DIFF_BASE: ${{ steps.scope.outputs.base || github.event.before || github.sha }}
        run: |
          node --test tests/ci-policy.test.mjs tests/e2e-scope.test.mjs tests/documentation.test.mjs tests/entryjs-cdn.test.mjs
          node scripts/check-docs.mjs
          if git cat-file -e "$DIFF_BASE^{commit}" 2>/dev/null; then
            git diff --check "$DIFF_BASE" HEAD
          else
            git show --check --format= HEAD
          fi
      - uses: actions/cache@v4
        if: steps.scope.outputs.mode != 'docs'
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v4
        if: steps.scope.outputs.mode != 'docs'
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ hashFiles('package-lock.json') }}-
      - if: steps.scope.outputs.mode != 'docs'
        run: npm ci
      - if: steps.scope.outputs.mode != 'docs'
        run: npm run lint
      - if: steps.scope.outputs.mode != 'docs'
        run: npm run typecheck
      - if: steps.scope.outputs.mode != 'docs'
        run: npm run test:review
      - if: steps.scope.outputs.mode != 'docs'
        run: npm run build
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.mode != 'docs'
        with:
          distribution: temurin
          java-version: '21'
      - if: steps.scope.outputs.mode != 'docs'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.mode != 'docs'
        run: npm run test:e2e:scope
